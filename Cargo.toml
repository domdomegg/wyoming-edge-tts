[package]
name = "wyoming-edge-tts"
version = "0.1.0"
edition = "2024"
description = "Wyoming protocol TTS server backed by Microsoft Edge's read-aloud API."
license = "MIT"
repository = "https://github.com/domdomegg/wyoming-edge-tts"
readme = "README.md"

[dependencies]
# Edge TTS WebSocket client.
msedge-tts = "0.3"

# MP3 decoding. The Microsoft free read-aloud endpoint only accepts
# `audio-24khz-48kbitrate-mono-mp3` (raw PCM formats are silently
# rejected), so we decode mp3 → PCM ourselves before forwarding.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

# Async runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

# JSON serialization for the Wyoming protocol.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling.
anyhow = "1.0"

[[bin]]
name = "wyoming-edge-tts"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "symbols"
