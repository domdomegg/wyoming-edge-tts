name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --release --bin wyoming-edge-tts
      # `cargo test` includes the end-to-end test in src/edge.rs which
      # hits Microsoft's read-aloud endpoint for real. If MS rotates
      # auth tokens or otherwise breaks the protocol, this test fails
      # — that's the signal we want.
      - name: test
        run: cargo test --all
